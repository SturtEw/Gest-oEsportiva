name: Firebase Hosting
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
jobs:
  hosting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation on push to main.
    defaults:
      run:
        working-directory: student-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: student-portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests (Vitest CI mode)
        run: npm run test:run
      - name: Check production configuration
        if: github.event_name == 'push'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_CANONICAL_ORIGIN: ${{ vars.VITE_CANONICAL_ORIGIN }}
          # Only "true"/"false", never the value: detects values saved under the
          # Secrets tab, which vars.* cannot read.
          FIREBASE_PROJECT_ID_IN_SECRETS: ${{ secrets.FIREBASE_PROJECT_ID != '' }}
          VITE_API_BASE_IN_SECRETS: ${{ secrets.VITE_API_BASE != '' }}
        run: |
          # ::error:: lines become run annotations, readable without opening the logs.
          failed=0
          misplaced_hint() {
            if [ "$2" = "true" ]; then
              echo "::error title=$1 is a Secret::$1 exists under Secrets, but this workflow reads it from Variables. Settings > Secrets and variables > Actions > Variables tab > New repository variable."
            fi
          }
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error title=Missing FIREBASE_PROJECT_ID::Repository variable FIREBASE_PROJECT_ID is empty (expected gestaoesportiva-9d8fa)."
            misplaced_hint FIREBASE_PROJECT_ID "$FIREBASE_PROJECT_ID_IN_SECRETS"
            failed=1
          fi
          case "$VITE_API_BASE" in
            https://*) ;;
            '')
              echo "::error title=Missing VITE_API_BASE::Repository variable VITE_API_BASE is empty (expected https://gestaoesportiva-api.onrender.com)."
              misplaced_hint VITE_API_BASE "$VITE_API_BASE_IN_SECRETS"
              failed=1 ;;
            *)
              echo "::error title=Invalid VITE_API_BASE::VITE_API_BASE must start with https:// (check for spaces or a missing scheme)."
              failed=1 ;;
          esac
          [ "$failed" -eq 0 ] || exit 1
          # Optional. Empty = no redirect from *.web.app (current setup).
          # Set to https://app.<dominio> only after the custom-domain migration
          # (docs/custom-domain.md); otherwise visitors are sent to a host that
          # does not serve the site yet.
          if [ -z "$VITE_CANONICAL_ORIGIN" ]; then
            echo 'VITE_CANONICAL_ORIGIN not set: canonical-domain redirect disabled.'
          else
            case "$VITE_CANONICAL_ORIGIN" in
              https://*) ;;
              *) echo 'VITE_CANONICAL_ORIGIN must start with https://'; exit 1 ;;
            esac
            case "${VITE_CANONICAL_ORIGIN#https://}" in
              ''|*/*|*'?'*|*'#'*) echo 'VITE_CANONICAL_ORIGIN must be an origin only, e.g. https://app.<dominio> (no path or trailing slash)'; exit 1 ;;
            esac
            case "$VITE_API_BASE" in
              *.onrender.com*) echo 'VITE_CANONICAL_ORIGIN is set but VITE_API_BASE still points to onrender.com: the session would stay cross-site. Set VITE_API_BASE to https://api.<dominio> first.'; exit 1 ;;
            esac
            echo "Canonical-domain redirect enabled: $VITE_CANONICAL_ORIGIN"
          fi
      - name: Build frontend
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_CANONICAL_ORIGIN: ${{ vars.VITE_CANONICAL_ORIGIN }}
        run: |
          npm run build
          # Vite inlines import.meta.env at build time; confirm the redirect target made it in.
          if [ -n "$VITE_CANONICAL_ORIGIN" ]; then
            grep -rqF -- "$VITE_CANONICAL_ORIGIN" dist/assets || { echo "VITE_CANONICAL_ORIGIN missing from the built bundle"; exit 1; }
          fi
      # Pull requests are validated but never published to the live site.
      - name: Check deployment credentials
        if: github.event_name == 'push'
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          failed=0
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || { echo '::error title=Missing GCP_WORKLOAD_IDENTITY_PROVIDER::Repository secret GCP_WORKLOAD_IDENTITY_PROVIDER is empty (Secrets tab, not Variables).'; failed=1; }
          test -n "$GCP_SERVICE_ACCOUNT" || { echo '::error title=Missing GCP_SERVICE_ACCOUNT::Repository secret GCP_SERVICE_ACCOUNT is empty (Secrets tab, not Variables).'; failed=1; }
          [ "$failed" -eq 0 ] || exit 1
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}

      - name: Deploy Firebase Hosting (live)
        if: github.event_name == 'push'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
